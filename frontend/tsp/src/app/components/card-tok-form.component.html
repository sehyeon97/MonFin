<div class="form-container">
    <h2>Card Tokenization Form</h2>

    <div class="form-group">
        <label>PAN</label>
        <input type="text" [(ngModel)]="pan" />
    </div>

    <div class="form-group">
        <label>CVV</label>
        <input type="text" [(ngModel)]="cvv" />
    </div>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="fullName" />
    </div>

    <div class="form-group">
        <label>Expire Month</label>
        <input type="text" [(ngModel)]="expMonth" />
    </div>

    <div class="form-group">
        <label>Expire Year</label>
        <input type="text" [(ngModel)]="expYear" />
    </div>

    <button (click)="addCardToAccount()">
        Add Card
    </button>
</div>
